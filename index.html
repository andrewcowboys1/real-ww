<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0B1D36" />
  <title>Callison Electric Heating & Cooling</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Brand colors matched to callisonelectrichvac.com
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50:  '#f0f7ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#0B1D36',  // main navy from website
              900: '#071224'
            },
            gold: {
              400: '#FBBF24',
              500: '#F5B301',  // primary CTA yellow
              600: '#E5A000',
              700: '#C48700'
            },
            heat: {
              500: '#E11D2E',  // red from HEATING•COOLING logo
              600: '#C01626'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f1f5f9;
    }
    .photo-grid img { object-fit: cover; height: 100px; width: 100%; border-radius: 8px; }
    .status-pill { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 9999px; }
    .logo-callison {
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #3b82f6 0%, #60a5fa 50%, #fbbf24 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .logo-sub {
      font-size: 0.55rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #E11D2E;
      text-transform: uppercase;
    }
    .btn-gold {
      background: #F5B301;
      color: #0B1D36;
      font-weight: 700;
    }
    .btn-gold:hover { background: #E5A000; }
    .btn-navy {
      background: #0B1D36;
      color: white;
      font-weight: 600;
    }
    .btn-navy:hover { background: #071224; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen">
  <div id="app" class="max-w-lg mx-auto min-h-screen bg-white shadow-xl"></div>
  <script src="app.js"></script>
</body>
</html>
