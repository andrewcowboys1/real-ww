<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Callison Electric & HVAC – Service Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd',
              400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8',
              800: '#1e40af', 900: '#1e3a8a'
            }
          }
        }
      }
    }
  </script>
  <style>
    .fade-in { animation: fadeIn 0.2s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <div id="app"></div>

  <script>
    // ===================== CONFIG =====================
    // Change this if your backend is on a different URL
    const API_BASE = (window.location.port === '3001' || window.location.hostname === 'localhost')
      ? 'http://localhost:3001'
      : '';   // same origin when served by the backend

    let useBackend = false;

    // Check if backend is available
    async function checkBackend() {
      try {
        const res = await fetch(API_BASE + '/api/health', { signal: AbortSignal.timeout(1500) });
        if (res.ok) {
          const info = await res.json();
          useBackend = true;
          console.log('Backend connected. Quo configured:', info.quoConfigured);
          return info;
        }
      } catch (e) {
        console.log('Backend not available – using local storage mode');
      }
      useBackend = false;
      return null;
    }

    // ===================== DATA =====================
    const STORAGE_KEY = 'callison_pro_v2';

    const defaultData = {
      users: [
        { id: 'u1', email: 'admin@callison.com', password: 'admin123', name: 'Office Admin', role: 'admin', phone: '555-0100' },
        { id: 'u2', email: 'tech@callison.com', password: 'tech123', name: 'Mike Rivera', role: 'technician', phone: '555-0101' },
        { id: 'u3', email: 'tech2@callison.com', password: 'tech123', name: 'Sarah Chen', role: 'technician', phone: '555-0102' },
        { id: 'u4', email: 'customer@example.com', password: 'cust123', name: 'Jane Thompson', role: 'customer', phone: '555-0200', address: '142 Maple Ave, Brooklyn, NY 11201' },
        { id: 'u5', email: 'bob@example.com', password: 'cust123', name: 'Bob Martinez', role: 'customer', phone: '555-0201', address: '88 Oak Street, Queens, NY 11375' }
      ],
      requests: [
        {
          id: 'SR-1001', customerId: 'u4', customerName: 'Jane Thompson', customerPhone: '555-0200', customerAddress: '142 Maple Ave, Brooklyn, NY 11201',
          serviceType: 'HVAC - Repair', urgency: 'high', description: 'AC not cooling, making loud noise on startup.',
          preferredDate: '2026-08-22', preferredTime: 'Morning (8am-12pm)', status: 'pending', createdAt: '2026-08-19T14:30:00Z', notes: ''
        }
      ],
      workOrders: [
        {
          id: 'WO-2001', requestId: null, customerId: 'u5', customerName: 'Bob Martinez', customerPhone: '555-0201',
          customerAddress: '88 Oak Street, Queens, NY 11375', serviceType: 'Electrical - Repair',
          description: 'Kitchen outlet not working, breaker keeps tripping.', urgency: 'normal',
          assignedTo: 'u2', assignedName: 'Mike Rivera', scheduledDate: '2026-08-21', scheduledTime: 'Afternoon (12pm-5pm)',
          status: 'scheduled', priority: 'normal', notes: 'Customer said it started after installing new fridge.',
          createdAt: '2026-08-18T10:00:00Z', updatedAt: '2026-08-18T10:00:00Z'
        },
        {
          id: 'WO-2002', requestId: null, customerId: 'u4', customerName: 'Jane Thompson', customerPhone: '555-0200',
          customerAddress: '142 Maple Ave, Brooklyn, NY 11201', serviceType: 'HVAC - Maintenance',
          description: 'Annual AC tune-up and filter change.', urgency: 'low',
          assignedTo: 'u3', assignedName: 'Sarah Chen', scheduledDate: '2026-08-20', scheduledTime: 'Morning (8am-12pm)',
          status: 'in_progress', priority: 'low', notes: '',
          createdAt: '2026-08-17T09:00:00Z', updatedAt: '2026-08-20T08:15:00Z'
        }
      ],
      nextId: 2003
    };

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultData));
          return structuredClone(defaultData);
        }
        return JSON.parse(raw);
      } catch {
        return structuredClone(defaultData);
      }
    }

    function saveData(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    let currentUser = null;

    function restoreSession() {
      try {
        const s = sessionStorage.getItem('callison_user');
        if (s) currentUser = JSON.parse(s);
      } catch {}
    }

    function login(email, password) {
      const data = loadData();
      const u = data.users.find(x => x.email.toLowerCase() === email.toLowerCase() && x.password === password);
      if (!u) return false;
      currentUser = { id: u.id, email: u.email, name: u.name, role: u.role, phone: u.phone, address: u.address || '' };
      sessionStorage.setItem('callison_user', JSON.stringify(currentUser));
      return true;
    }

    function logout() {
      currentUser = null;
      sessionStorage.removeItem('callison_user');
      render();
    }

    function registerCustomer({ name, email, password, phone, address }) {
      const data = loadData();
      if (data.users.some(u => u.email.toLowerCase() === email.toLowerCase())) {
        return { ok: false, error: 'Email already registered' };
      }
      const newUser = {
        id: 'u' + Date.now(),
        email, password, name, role: 'customer', phone, address
      };
      data.users.push(newUser);
      saveData(data);
      return { ok: true };
    }

    // ===================== HELPERS =====================
    function formatDate(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }
    function formatDateTime(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    }
    function statusBadge(s) {
      const map = {
        pending: 'bg-amber-100 text-amber-800',
        converted: 'bg-indigo-100 text-indigo-800',
        scheduled: 'bg-blue-100 text-blue-800',
        in_progress: 'bg-cyan-100 text-cyan-800',
        on_the_way: 'bg-violet-100 text-violet-800',
        completed: 'bg-emerald-100 text-emerald-800',
        cancelled: 'bg-slate-100 text-slate-600'
      };
      return `<span class="inline-flex px-2.5 py-0.5 rounded-full text-xs font-medium ${map[s] || 'bg-slate-100'}">${(s||'').replace(/_/g,' ')}</span>`;
    }
    function priorityBadge(p) {
      const map = { low: 'bg-slate-100 text-slate-600', normal: 'bg-blue-100 text-blue-700', high: 'bg-orange-100 text-orange-700', urgent: 'bg-red-100 text-red-700' };
      return `<span class="inline-flex px-2 py-0.5 rounded text-xs font-medium ${map[p] || map.normal}">${p || 'normal'}</span>`;
    }
    function urgencyBadge(u) {
      return priorityBadge(u);
    }

    // Google Calendar link (opens Google Calendar with pre-filled event)
    function googleCalendarUrl(wo) {
      const title = encodeURIComponent(`Callison: ${wo.serviceType} – ${wo.customerName}`);
      const details = encodeURIComponent(
        `Work Order: ${wo.id}\nCustomer: ${wo.customerName}\nPhone: ${wo.customerPhone || ''}\nAddress: ${wo.customerAddress || ''}\n\n${wo.description || ''}\n\nNotes: ${wo.notes || ''}`
      );
      const location = encodeURIComponent(wo.customerAddress || '');
      let dates = '';
      if (wo.scheduledDate) {
        // All-day style date range YYYYMMDD / YYYYMMDD+1
        const d = wo.scheduledDate.replace(/-/g, '');
        const next = new Date(wo.scheduledDate);
        next.setDate(next.getDate() + 1);
        const d2 = next.toISOString().slice(0,10).replace(/-/g, '');
        dates = `${d}/${d2}`;
      }
      let url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&details=${details}&location=${location}`;
      if (dates) url += `&dates=${dates}`;
      return url;
    }

    // SMS "On the way" – opens native SMS app with pre-filled message
    function onTheWaySmsLink(wo, techName) {
      const phone = (wo.customerPhone || '').replace(/\D/g, '');
      const body = encodeURIComponent(
        `Hi ${wo.customerName.split(' ')[0]}, this is ${techName} from Callison Electric & HVAC. I'm on my way to your location for job ${wo.id} (${wo.serviceType}). See you soon!`
      );
      return phone ? `sms:${phone}?body=${body}` : '#';
    }

    // ===================== BUSINESS LOGIC =====================
    function createRequest(payload) {
      const data = loadData();
      const req = {
        id: 'SR-' + Date.now(),
        customerId: currentUser.id,
        customerName: currentUser.name,
        customerPhone: currentUser.phone || payload.phone,
        customerAddress: currentUser.address || payload.address,
        serviceType: payload.serviceType,
        urgency: payload.urgency || 'normal',
        description: payload.description,
        preferredDate: payload.preferredDate,
        preferredTime: payload.preferredTime,
        status: 'pending',
        createdAt: new Date().toISOString(),
        notes: ''
      };
      data.requests.unshift(req);
      saveData(data);
      return req;
    }

    function convertToWorkOrder(requestId, { assignedTo, scheduledDate, scheduledTime, priority, notes }) {
      const data = loadData();
      const req = data.requests.find(r => r.id === requestId);
      if (!req) return null;
      const tech = data.users.find(u => u.id === assignedTo);
      const wo = {
        id: 'WO-' + (data.nextId++),
        requestId: req.id,
        customerId: req.customerId,
        customerName: req.customerName,
        customerPhone: req.customerPhone,
        customerAddress: req.customerAddress,
        serviceType: req.serviceType,
        description: req.description,
        urgency: req.urgency,
        assignedTo: assignedTo || null,
        assignedName: tech ? tech.name : null,
        scheduledDate: scheduledDate || null,
        scheduledTime: scheduledTime || 'Anytime',
        status: 'scheduled',
        priority: priority || req.urgency || 'normal',
        notes: notes || '',
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };
      data.workOrders.unshift(wo);
      req.status = 'converted';
      req.workOrderId = wo.id;
      saveData(data);
      return wo;
    }

    function createWorkOrder(payload) {
      const data = loadData();
      const tech = data.users.find(u => u.id === payload.assignedTo);
      const wo = {
        id: 'WO-' + (data.nextId++),
        requestId: null,
        customerId: payload.customerId || null,
        customerName: payload.customerName,
        customerPhone: payload.customerPhone,
        customerAddress: payload.customerAddress,
        serviceType: payload.serviceType,
        description: payload.description,
        urgency: payload.urgency || 'normal',
        assignedTo: payload.assignedTo || null,
        assignedName: tech ? tech.name : null,
        scheduledDate: payload.scheduledDate,
        scheduledTime: payload.scheduledTime,
        status: 'scheduled',
        priority: payload.priority || 'normal',
        notes: payload.notes || '',
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };
      data.workOrders.unshift(wo);
      saveData(data);
      return wo;
    }

    function updateWorkOrder(id, updates) {
      const data = loadData();
      const wo = data.workOrders.find(w => w.id === id);
      if (!wo) return;
      Object.assign(wo, updates, { updatedAt: new Date().toISOString() });
      if (updates.assignedTo) {
        const tech = data.users.find(u => u.id === updates.assignedTo);
        wo.assignedName = tech ? tech.name : null;
      }
      saveData(data);
    }

    function addJobNote(id, note) {
      const data = loadData();
      const wo = data.workOrders.find(w => w.id === id);
      if (!wo) return;
      const stamp = new Date().toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
      wo.notes = (wo.notes ? wo.notes + '\n' : '') + `[${stamp}] ${note}`;
      wo.updatedAt = new Date().toISOString();
      saveData(data);
    }

    // ===================== RENDER =====================
    function render() {
      restoreSession();
      const root = document.getElementById('app');
      if (!currentUser) {
        root.innerHTML = renderAuth();
        bindAuth();
        return;
      }
      if (currentUser.role === 'customer') {
        root.innerHTML = renderCustomer();
        bindCustomer();
      } else if (currentUser.role === 'admin') {
        root.innerHTML = renderAdmin();
        bindAdmin();
      } else {
        root.innerHTML = renderTech();
        bindTech();
      }
    }

    // ---------- AUTH ----------
    function renderAuth() {
      return `
      <div class="min-h-screen flex">
        <div class="hidden lg:flex lg:w-5/12 bg-gradient-to-br from-brand-900 to-brand-700 text-white flex-col justify-between p-12">
          <div>
            <div class="flex items-center gap-3 mb-10">
              <div class="w-12 h-12 rounded-xl bg-white/20 flex items-center justify-center text-2xl font-bold">C</div>
              <div>
                <div class="text-2xl font-bold">Callison</div>
                <div class="text-brand-200 text-sm">Electric & HVAC</div>
              </div>
            </div>
            <h1 class="text-4xl font-bold leading-tight mb-4">Service Portal</h1>
            <p class="text-brand-100 text-lg max-w-sm">Customers request service. Office manages jobs. Technicians get clear daily work lists.</p>
          </div>
          <div class="text-brand-300 text-sm">Stage 2 • Full featured local demo</div>
        </div>
        <div class="flex-1 flex items-center justify-center p-6">
          <div class="w-full max-w-md">
            <div class="lg:hidden flex items-center gap-3 mb-8 justify-center">
              <div class="w-10 h-10 bg-brand-600 rounded-lg flex items-center justify-center text-white font-bold">C</div>
              <div class="font-bold text-xl">Callison Electric & HVAC</div>
            </div>
            <div class="flex border-b border-slate-200 mb-6">
              <button data-tab="login" class="auth-tab flex-1 py-3 text-center font-medium border-b-2 border-brand-600 text-brand-700">Sign In</button>
              <button data-tab="register" class="auth-tab flex-1 py-3 text-center font-medium border-b-2 border-transparent text-slate-500">Create Account</button>
            </div>
            <div id="login-panel" class="space-y-4 fade-in">
              <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                <input id="login-email" type="email" class="w-full px-3 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 outline-none" value="admin@callison.com">
              </div>
              <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <input id="login-pass" type="password" class="w-full px-3 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 outline-none" value="admin123">
              </div>
              <div id="login-err" class="text-red-600 text-sm hidden"></div>
              <button id="login-btn" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-medium py-2.5 rounded-lg">Sign In</button>
              <div class="mt-4 p-4 bg-slate-100 rounded-lg text-sm text-slate-600">
                <div class="font-medium mb-2">Demo accounts</div>
                <div class="space-y-1 font-mono text-xs">
                  <div>Admin → admin@callison.com / admin123</div>
                  <div>Tech → tech@callison.com / tech123</div>
                  <div>Tech 2 → tech2@callison.com / tech123</div>
                  <div>Customer → customer@example.com / cust123</div>
                </div>
              </div>
            </div>
            <div id="register-panel" class="space-y-4 fade-in hidden">
              <div><label class="block text-sm font-medium text-slate-700 mb-1">Full Name</label><input id="reg-name" class="w-full px-3 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 outline-none"></div>
              <div><label class="block text-sm font-medium text-slate-700 mb-1">Email</label><input id="reg-email" type="email" class="w-full px-3 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 outline-none"></div>
              <div><label class="block text-sm font-medium text-slate-700 mb-1">Phone</label><input id="reg-phone" type="tel" class="w-full px-3 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 outline-none"></div>
              <div><label class="block text-sm font-medium text-slate-700 mb-1">Service Address</label><input id="reg-address" class="w-full px-3 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 outline-none" placeholder="Street, City, State ZIP"></div>
              <div><label class="block text-sm font-medium text-slate-700 mb-1">Password</label><input id="reg-pass" type="password" class="w-full px-3 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 outline-none"></div>
              <div id="reg-err" class="text-red-600 text-sm hidden"></div>
              <button id="reg-btn" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-medium py-2.5 rounded-lg">Create Customer Account</button>
            </div>
          </div>
        </div>
      </div>`;
    }

    function bindAuth() {
      document.querySelectorAll('.auth-tab').forEach(btn => {
        btn.onclick = () => {
          const tab = btn.dataset.tab;
          document.querySelectorAll('.auth-tab').forEach(b => {
            b.classList.toggle('border-brand-600', b.dataset.tab === tab);
            b.classList.toggle('text-brand-700', b.dataset.tab === tab);
            b.classList.toggle('border-transparent', b.dataset.tab !== tab);
            b.classList.toggle('text-slate-500', b.dataset.tab !== tab);
          });
          document.getElementById('login-panel').classList.toggle('hidden', tab !== 'login');
          document.getElementById('register-panel').classList.toggle('hidden', tab !== 'register');
        };
      });
      document.getElementById('login-btn').onclick = () => {
        const email = document.getElementById('login-email').value.trim();
        const pass = document.getElementById('login-pass').value;
        const err = document.getElementById('login-err');
        if (login(email, pass)) render();
        else { err.textContent = 'Invalid email or password'; err.classList.remove('hidden'); }
      };
      document.getElementById('reg-btn').onclick = () => {
        const name = document.getElementById('reg-name').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const phone = document.getElementById('reg-phone').value.trim();
        const address = document.getElementById('reg-address').value.trim();
        const password = document.getElementById('reg-pass').value;
        const err = document.getElementById('reg-err');
        if (!name || !email || !password) {
          err.textContent = 'Name, email and password are required';
          err.classList.remove('hidden');
          return;
        }
        const res = registerCustomer({ name, email, password, phone, address });
        if (res.ok) { login(email, password); render(); }
        else { err.textContent = res.error; err.classList.remove('hidden'); }
      };
    }

    function header(title) {
      return `
      <header class="bg-white border-b border-slate-200 sticky top-0 z-20">
        <div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-brand-600 rounded-lg flex items-center justify-center text-white text-sm font-bold">C</div>
            <div>
              <div class="font-semibold text-slate-900 leading-tight">Callison Electric & HVAC</div>
              <div class="text-xs text-slate-500">${title}</div>
            </div>
          </div>
          <div class="flex items-center gap-4">
            <div class="text-right hidden sm:block">
              <div class="text-sm font-medium">${currentUser.name}</div>
              <div class="text-xs text-slate-500 capitalize">${currentUser.role}</div>
            </div>
            <button id="logout-btn" class="text-sm text-slate-600 hover:text-brand-600 font-medium">Sign out</button>
          </div>
        </div>
      </header>`;
    }

    // ---------- CUSTOMER ----------
    function renderCustomer() {
      const data = loadData();
      const myReq = data.requests.filter(r => r.customerId === currentUser.id);
      const myWO = data.workOrders.filter(w => w.customerId === currentUser.id);

      return `
      ${header('Customer Portal')}
      <main class="max-w-4xl mx-auto px-4 py-8">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8">
          <div>
            <h1 class="text-2xl font-bold">Welcome, ${currentUser.name.split(' ')[0]}</h1>
            <p class="text-slate-500 mt-1">Request service and track your jobs.</p>
          </div>
          <button id="new-req-btn" class="inline-flex items-center gap-2 bg-brand-600 hover:bg-brand-700 text-white font-medium px-4 py-2.5 rounded-lg">
            + New Service Request
          </button>
        </div>

        <!-- New Request Modal -->
        <div id="req-modal" class="fixed inset-0 bg-black/40 z-30 hidden items-center justify-center p-4">
          <div class="bg-white rounded-xl shadow-xl w-full max-w-lg fade-in">
            <div class="px-6 py-4 border-b flex justify-between items-center">
              <h2 class="text-lg font-semibold">New Service Request</h2>
              <button id="close-req" class="text-2xl text-slate-400 hover:text-slate-600">&times;</button>
            </div>
            <div class="p-6 space-y-4">
              <div>
                <label class="block text-sm font-medium mb-1">Service Type</label>
                <select id="req-type" class="w-full px-3 py-2.5 border rounded-lg">
                  <option>HVAC - Repair</option>
                  <option>HVAC - Maintenance / Tune-up</option>
                  <option>HVAC - New Install</option>
                  <option>Electrical - Repair</option>
                  <option>Electrical - Install / Upgrade</option>
                  <option>Emergency Service</option>
                  <option>Other</option>
                </select>
              </div>
              <div>
                <label class="block text-sm font-medium mb-1">Urgency</label>
                <select id="req-urgency" class="w-full px-3 py-2.5 border rounded-lg">
                  <option value="normal">Normal</option>
                  <option value="low">Low</option>
                  <option value="high">High</option>
                  <option value="urgent">Urgent / Emergency</option>
                </select>
              </div>
              <div>
                <label class="block text-sm font-medium mb-1">Description</label>
                <textarea id="req-desc" rows="3" class="w-full px-3 py-2.5 border rounded-lg" placeholder="Describe the problem in detail..."></textarea>
              </div>
              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label class="block text-sm font-medium mb-1">Preferred Date</label>
                  <input type="date" id="req-date" class="w-full px-3 py-2.5 border rounded-lg">
                </div>
                <div>
                  <label class="block text-sm font-medium mb-1">Preferred Time</label>
                  <select id="req-time" class="w-full px-3 py-2.5 border rounded-lg">
                    <option>Morning (8am-12pm)</option>
                    <option>Afternoon (12pm-5pm)</option>
                    <option>Anytime</option>
                  </select>
                </div>
              </div>
              <div id="req-err" class="text-red-600 text-sm hidden"></div>
            </div>
            <div class="px-6 py-4 border-t flex justify-end gap-3">
              <button id="cancel-req" class="px-4 py-2 text-slate-600">Cancel</button>
              <button id="submit-req" class="px-5 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-lg font-medium">Submit Request</button>
            </div>

    function bindAdmin() {

          const id = btn.dataset.id;
          const techSel = document.querySelector(`.convert-tech[data-id="${id}"]`);
          const dateInput = document.querySelector(`.convert-date[data-id="${id}"]`);
          convertToWorkOrder(id, {
            assignedTo: techSel.value || null,
            scheduledDate: dateInput.value || null,
            scheduledTime: 'Anytime',
            priority: 'normal'
          });
          render();
        };
      });

      document.querySelectorAll('.status-select').forEach(sel => {
        sel.onchange = () => {
          updateWorkOrder(sel.dataset.id, { status: sel.value });
          render();
        };
      });

      const modal = document.getElementById('wo-modal');
      document.getElementById('new-wo-btn').onclick = () => { modal.classList.remove('hidden'); modal.classList.add('flex'); };
      document.getElementById('close-wo').onclick = document.getElementById('cancel-wo').onclick = () => {
        modal.classList.add('hidden'); modal.classList.remove('flex');

    // ---------- TECHNICIAN ----------
    function renderTech() {
      const data = loadData();
      const myJobs = data.workOrders
        .filter(w => w.assignedTo === currentUser.id && w.status !== 'completed' && w.status !== 'cancelled')
        .sort((a, b) => {
          const order = { urgent: 0, high: 1, normal: 2, low: 3 };
          return (order[a.priority] || 2) - (order[b.priority] || 2);
        });
      const completed = data.workOrders.filter(w => w.assignedTo === currentUser.id && w.status === 'completed');

      return `

        </div>

        <div class="space-y-4">
          ${myJobs.length === 0 ? `<div class="bg-white border rounded-xl p-8 text-center text-slate-400">No jobs assigned right now.</div>` :
            myJobs.map(wo => `
              <div class="bg-white border rounded-xl p-5 shadow-sm">
                <div class="flex items-start justify-between gap-3 mb-3">
                  <div>
                    <div class="flex items-center gap-2 flex-wrap">

                      ${priorityBadge(wo.priority)}

                <div class="text-sm text-slate-600 mb-3">${wo.description || 'No description'}</div>

                <div class="bg-slate-50 rounded-lg p-3 text-sm space-y-1 mb-4">
                  <div><span class="text-slate-500">Customer:</span> <span class="font-medium">${wo.customerName}</span></div>
                  <div><span class="text-slate-500">Phone:</span> <a href="tel:${wo.customerPhone}" class="text-brand-600 font-medium">${wo.customerPhone || '—'}</a></div>
                  <div><span class="text-slate-500">Address:</span> ${wo.customerAddress || '—'}</div>
                  <div><span class="text-slate-500">Scheduled:</span> ${wo.scheduledDate || 'TBD'} ${wo.scheduledTime || ''}</div>
                </div>

                ${wo.notes ? `<div class="text-xs bg-amber-50 border border-amber-100 rounded-lg p-3 mb-4 text-slate-700 whitespace-pre-wrap">${wo.notes}</div>` : ''}

                  ${(wo.status === 'scheduled' || wo.status === 'in_progress') ? `

                    <button class="tech-status flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-lg text-sm" data-id="${wo.id}" data-status="completed">Mark Complete</button>` : ''}

          if (useBackend) {
            try {
              const res = await fetch(API_BASE + '/api/work-orders/' + id + '/on-the-way', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ techName: currentUser.name })
              });
              const result = await res.json();
              if (result.sms && result.sms.ok) {
                alert('SMS sent successfully to customer via Quo!');
              } else if (result.sms && result.sms.simulated) {
                alert('Status updated. (Quo API key not configured – SMS was simulated)');
              } else if (result.sms && result.sms.error) {
                alert('Status updated, but SMS failed: ' + result.sms.error);
              } else {
                alert('Status updated to On the Way.');
              }
              // Refresh local data from backend if possible
              try {
                const dRes = await fetch(API_BASE + '/api/data');
                if (dRes.ok) {
                  const remote = await dRes.json();
                  // Keep local storage in sync for offline-ish use
                  const local = loadData();
                  local.workOrders = remote.workOrders;
                  local.requests = remote.requests;
                  saveData(local);
                }
              } catch {}
            } catch (err) {
              alert('Could not reach server. Falling back to local mode.');
              // fallback
              updateWorkOrder(id, { status: 'on_the_way' });
              addJobNote(id, `Technician ${currentUser.name} marked On the Way.`);
            }
          } else {
            // Local / no backend mode – open native SMS
            const data = loadData();
            const wo = data.workOrders.find(w => w.id === id);
            if (!wo) return;
            updateWorkOrder(wo.id, { status: 'on_the_way' });
            addJobNote(wo.id, `Technician ${currentUser.name} marked On the Way and notified customer via SMS.`);
            const smsUrl = onTheWaySmsLink(wo, currentUser.name);
            if (smsUrl !== '#') {
              window.location.href = smsUrl;
            } else {
              alert('No customer phone number on this job. Status updated.');
            }
          }
          render();
        };
      });
      document.querySelectorAll('.add-note-btn').forEach(btn => {
        btn.onclick = () => {
          const note = prompt('Add a note to this job:');
          if (note && note.trim()) {
            addJobNote(btn.dataset.id, note.trim());
            render();
          }
        };
      });
    }

    // INIT
    (async function init() {
      await checkBackend();
      restoreSession();
      render();
    })();
  </script>
</body>
</html>
